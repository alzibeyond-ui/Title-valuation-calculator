<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVERHIA CALC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystenFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #212121;
            color: #212121;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #171717;
            border: 1px solid #2f2f2f;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 1250px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        /* Header Dashboard */
        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #2f2f2f;
            padding-bottom: 20px;
        }
        .dashboard-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .dashboard-header p {
            font-size: 0.9rem;
            color: #8e8ea0;
        }
        /*Layout Grid 2 kolom ( kiri: form, kanan: hasil )*/
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.1fr 1.4fr;
            gap: 25px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }    
        /*Panel Sisi Kanan (Hasil)*/
        .result-panel {
            background: #1e1e1e;
            border: 1px solid #2f2f2f;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;

        }
        /* Linear progress container */
        .progress-container {
            background: #212121;
            border: 1px solid #2f2f2f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .score-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .score-label-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8e8ea0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .gauge-score {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -1px;
        }
        .score-max {
            font-size: 0.9rem;
            font-weight: 600;
            color: #8e8ea0;
           
        }
        .progress-track {
            width: 100%;
            height: 10px;
            background: #2f2f2f;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-fill {
            height: 100%;
            background: #10a37f;
            width: 0%;
            border-radius : 5px;
            transition: width 0.5s ease-in-out;
        }
        .gauge-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            margin-top: 6px;
        }
        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #8e8ea0;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            background-color: #212121;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            color: #ececec;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #10a37f;
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.2);
        }
        button#calcBtn {
            width: 100%;
            padding: 13px;
            background: #22c55e;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
            transition: background 0.2s;
        }
        button#calcBtn:hover {
            background: #16a34a;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5)
        }
        /* Factor Cards Grid */
        .factor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .factor-card {
            background: #212121;
            border: 1px solid #2f2f2f;
            border-radius: 10px;
            padding: 12px;
            position: relative;
            overflow: hidden;
        }
        /* Aksen garis tipis hijau Open AI dikiri card */
        .factor-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            background: #10a37f;
        }
        .factor-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .factor-name {
            font-size: 0.73rem;
            color: #8e8ea0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        /* Summarry Banner di bawah card */
        .summary-banner {
            margin-top: 14px;
            background: #212121;
            border: 1px solid #2f2f2f;
            border-radius: 10px;
            padding: 14px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ececec;
            display: none;
        }
        .placeholder-text {
            color: #8e8ea0;
            font-size: 0.9rem;
            text-align: center;
            font-style: italic;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="dashboard-header">
            <h1 id="dashboardTitle">IVERHIA CALC</h1>
            <p id="dashboardSubtitle">Evaluate fundamental metrics and financial health.</p>
        </div>

        <!-- Dashboard-Grid -->
        <div class="dashboard-grid">
            <div class="form-panel">
                <form id="valueForm">
                    <div class="form-group">
                        <label for="name">Company Name</label>
                        <input type="text" id="name" placeholder="Company Name...">
                    </div>

            <!-- 1. Liquidity / Cash Flow -->
            <div class="form-group">
                <label for="liquidity">Liquidity Ratio</label>
                <select id="liquidity">
                    <option value="" disabled selected>Select Liquidity...</option>
                    <option value="50">&gt; 3.0x (Massive Cash Buffer)</option>
                    <option value="40">2.0x - 3.0x (Strong Liquidity)</option>
                    <option value="30">1.2x - 2.0x (Healthy Standard)</option>
                    <option value="20">1.0x - 1.2x (Tight Cash Flow)</option>
                    <option value="10">&lt; 1.0x (Liquidity Risk)</option>
                </select>
            </div>

            <!-- 2. Leverage -->
            <div class="form-group">
                <label for="leverage">Leverage (Debt-to-Equity Ratio)</label>
                <select id="leverage">
                    <option value="" disabled selected>Select Leverage...</option>
                    <option value="50">&lt; 0.2x (Pristine / Near Debt-Free)</option>
                    <option value="40">0.2x - 0.5x (Conservative & Safe)</option>
                    <option value="30">0.5x - 1.0x (Moderate Leverage)</option>
                    <option value="15">1.0x - 2.0x (High Debt Exposure)</option>
                    <option value="5">&gt; 2.0x (High Insolvency Risk)</option>
                </select>
            </div>

            <!-- 3. Profitability -->
            <div class="form-group">
                <label for="profitability">Profitability (Net Profit Margin)</label>
                <select id="profitability">
                    <option value="" disabled selected>Select Profitability...</option>
                    <option value="50">&gt; 20% (Elite Cash Cow)</option>
                    <option value="40">10% - 20% (High Margin)</option>
                    <option value="30">5% - 10% (Solid Operating Margin)</option>
                    <option value="20">1% - 5% (Low Margin)</option>
                    <option value="10">&lt; 1% (Burning Cash Flow)</option>
                </select>
            </div>

            <!-- 4. Return on Equity -->
            <div class="form-group">
                <label for="roe">Return on Equity</label>
                <select id="roe">
                    <option value="" disabled selected>Select ROE...</option>
                    <option value="50">&gt; 20% (Exceptional Compounder)</option>
                    <option value="40">15% - 20% (Strong Returns)</option>
                    <option value="30">10% - 15% (Average Market Returns)</option>
                    <option value="20">5% - 10% (Subpar Efficiency)</option>
                    <option value="10">&lt; 5% (Poor Capital Efficiency)</option>
                </select>
            </div>

            <!-- 5. Growth Rate-->
            <div class="form-group">
                <label for="growth">Growth Rate (YoY Revenue Growth)</label>
                <select id="growth">
                    <option value="" disabled selected>Select Growth Rate...</option>
                    <option value="50">&gt; 50% YoY (Hypergrowth Scale)</option>
                    <option value="35">30% - 50% YoY (Rapid Expansion)</option>
                    <option value="25">15% - 30% YoY (Steady Growth)</option>
                    <option value="15">5% - 15% YoY (Mature / Stable Growth)</option>
                    <option value="5">&lt; 5% YoY (Stagnant / Declining)</option>
                </select>
            </div>

            <!-- 6. Interest Coverage Ratio-->
            <div class="form-group">
                <label for="coverage">Interest Coverage Ratio</label>
                <select id="coverage">
                    <option value="" disabled selected>Select Interest Coverage Ratio...</option>
                    <option value="50">&gt; 8.0x (Bulletproof Coverage)</option>
                    <option value="35">5.0x - 8.0 (Very Safe)</option>
                    <option value="25">2.5x - 5.0x (Adequate Buffer)</option>
                    <option value="15">1.0x - 2.5x (Vulnerable to Earnings Drop)</option>
                    <option value="5">&lt; 1.0x (Default / Cannot Cover Interest)</option>
                </select>
            </div>

            <button type="button" id="calcBtn">Calculate My Value</button>
        </form>
    </div>

    <!-- SISI KANAN: PANEL HASIL VALUASI -->
            <div class="result-panel">
                <div class="progress-container">
                    <div class="score-info">
                        <span class="score-label-text">Fundamental Score</span>
                        <div>
                            <span class="gauge-score" id="displayScore">0</span><span class="score-max">/300</span>
                        </div>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="gaugeProgress"></div>
                    </div>
                    <div class="gauge-label" id="displayRating" style="color: #10a37f;">AWAITING INPUT</div>
                </div>

                <!-- Placeholder sebelum diklik -->
                <div class="placeholder-text" id="placeholderText">
                    Select financial metrics on the left and hit calculate to view terminal breakdown.
                </div>

        <!-- Grid kartu faktor keuangan-->
        <div class="factor-grid" id="factorGrid">
            <div class="factor-card">
                <div class="factor-value" id="liquidityValue">-</div>
                <div class="factor-name">Liquidity</div>
            </div>
            <div class="factor-card">
                <div class="factor-value" id="leverageValue">-</div>
                <div class="factor-name">Leverage</div>
            </div>
            <div class="factor-card">
                <div class="factor-value" id="profitabilityValue">-</div>
                <div class="factor-name">Profitability</div>
            </div>
            <div class="factor-card">
                <div class="factor-value" id="roeValue">-</div>
                <div class="factor-name">ROE</div>
            </div>
            <div class="factor-card">
                <div class="factor-value" id="growthValue">-</div>
                <div class="factor-name">Growth Rate</div>
            </div>
            <div class="factor-card">
                <div class="factor-value" id="coverageValue">-</div>
                <div class="factor-name">Interest Coverage</div>
            </div>
        </div>

        <div class="summary-banner" id="summaryBanner"></div>
    </div>

    <script>
        const btn = document.getElementById('calcBtn');
        
        btn.addEventListener('click', function() {
            const companyName = document.getElementById('name').value || "Anonim";

            const liquiditySelect = document.getElementById('liquidity');
            const leverageSelect= document.getElementById('leverage');
            const profitabilitySelect = document.getElementById('profitability');
            const roeSelect= document.getElementById('roe');
            const growthSelect = document.getElementById('growth');
            const coverageSelect = document.getElementById('coverage');

           const liquidityScore = parseInt(liquiditySelect.value) || 0;
           const leverageScore = parseInt(leverageSelect.value) || 0;
           const profitabilityScore = parseInt(profitabilitySelect.value) || 0;
           const roeScore = parseInt(roeSelect.value) || 0;
           const growthScore = parseInt(growthSelect.value) || 0;
           const coverageScore = parseInt(coverageSelect.value) || 0;

            const totalScore = liquidityScore + leverageScore + profitabilityScore + roeScore + growthScore + coverageScore;
            const maxScore = 300;

            // Hitung persentase untuk progress bar lurus
            const percentage = (totalScore / maxScore) * 100;
            document.getElementById('gaugeProgress').style.width = percentage + '%';
            document.getElementById('displayScore').innerText = totalScore;

            let ratingText = "";
            let HealthMessage = "";
            let badgecolor = "";

            if (totalScore >= 230) {
                ratingText = "TIER 1 (APEX-LEVEL)";
                healthMessage = `</b>${companyName}:</b> Bro's literally untouchable. Pure cash machine, out here flexing on the entire market.`;
                badgecolor = "#3b82f6"; // Blue
            } else if (totalScore >= 180) {
                ratingText = "TIER 2 (ELITE-LEVEL)";
                badgecolor = "#a855f7"; // Purple
                healthMessage = `<b>${companyName}:</b> Lowkey a beast. Clean margins, zero stress, absolute solid compounding.`;
            } else if (totalScore >= 150) {
                ratingText = "TIER 3 (MID-LEVEL)";
                badgecolor = "#eab308"; // Yellow / Orange
                healthMessage = `<b>${companyName}:</b> Safe for now, but walking on thin ice. One bad quarter and it's over.`;
            } else if (totalScore >= 100) {
                ratingText = "TIER 4 (TRASH-LEVEL)";
                badgecolor = "#f97316"; // Orange pekat
                healthMessage = `<b>${companyName}:</b> Major red flags. Drowning in debt and gaslighting retail investors.`;
            } else {
                ratingText = "TIER 5 (DEAD-LEVEL)";
                badgecolor = "#ef4444"; // Red
                healthMessage = `<b>${companyName}:</b> Wallahi its over bruv 😭😭🥀.`;
            } 
            
            const labelEl  = document.getElementById('displayRating');
            labelEl.innerText = ratingText;
            labelEl.style.color = badgecolor;

            // ubah warna progress bar sesuai tier
            document.getElementById('gaugeProgress').style.backgroundColor = badgecolor;
            documenyt.getElementById('displayRating').style.color = badgecolor;

            // Ambil teks ringkas dari opsi dropdown
            document.getElementById('liquidityValue').innerText = liquiditySelect.options[liquiditySelect.selectedIndex].text.split(' ')[0];
            document.getElementById('leverageValue').innerText = leverageSelect.options[leverageSelect.selectedIndex].text.split(' ')[0];
            document.getElementById('profitabilityValue').innerText = profitabilitySelect.options[profitabilitySelect.selectedIndex].text.split(' ')[0];
            document.getElementById('roeValue').innerText = roeSelect.options[roeSelect.selectedIndex].text.split(' ')[0];
            document.getElementById('growthValue').innerText = growthSelect.options[growthSelect.selectedIndex].text.split(' ')[0];
            document.getElementById('coverageValue').innerText = coverageSelect.options[coverageSelect.selectedIndex].text.split(' ')[0];

            // Tampilkan Elemen Hasil dan sembunyikan placeholder
            document.getElementById('placeholderText').style.display = 'none';
            document.getElementById('factorGrid').style.display = 'grid';
            const banner = document.getElementById('summaryBanner');
            banner.style.display = 'block';
            banner.innerHTML = healthMessage;
        });
    </script>
</body>
</html>
